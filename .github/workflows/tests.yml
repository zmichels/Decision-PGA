name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run evaluation smoke test
        run: python -m decision_pga.cli evaluate --config examples/evaluation_config.json --output reports/ci

      - name: Run application evaluation smoke test
        run: python -m decision_pga.cli evaluate --suite application --output reports/application-ci

      - name: Validate work tracker
        run: python scripts/work_tracker.py docs/work --summary

      - name: Install MCP extra
        run: python -m pip install -e ".[mcp]"

      - name: Smoke test MCP server construction
        run: python -c "from decision_pga.mcp_server import build_server; build_server()"
