[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-pga"
version = "0.1.0"
description = "Decision-PGA diagnostics for probability clouds on the categorical simplex."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.8",
]

[project.scripts]
decision-pga = "decision_pga.cli:main"

[tool.setuptools.packages.find]
include = ["decision_pga*"]
